[package]
name = "labtether-cli-platform"
description = "Config file protection for the LabTether Rust CLI: mode 0600 on Unix, a private ACL on Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

# The Windows ACL calls need `unsafe`; this crate denies it everywhere else.
# Every other crate in the workspace forbids it.
[lints.rust]
unsafe_code = "deny"
