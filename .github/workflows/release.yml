name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
            archive: zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Build CLI binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ github.ref_name }}
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X github.com/labtether/labtether-cli/cmd.version=${VERSION}" \
            -o "labtether-cli-${SUFFIX}" \
            .

      - name: Create tarball
        if: matrix.archive == 'tar.gz'
        env:
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ github.ref_name }}
        run: |
          tar czf "labtether-cli-${SUFFIX}-${VERSION}.tar.gz" "labtether-cli-${SUFFIX}"
          sha256sum "labtether-cli-${SUFFIX}-${VERSION}.tar.gz" > "labtether-cli-${SUFFIX}-${VERSION}.tar.gz.sha256"

      - name: Create zip
        if: matrix.archive == 'zip'
        env:
          SUFFIX: ${{ matrix.suffix }}
          VERSION: ${{ github.ref_name }}
        run: |
          zip "labtether-cli-${SUFFIX}-${VERSION}.zip" "labtether-cli-${SUFFIX}"
          sha256sum "labtether-cli-${SUFFIX}-${VERSION}.zip" > "labtether-cli-${SUFFIX}-${VERSION}.zip.sha256"

      - name: Checksum raw binary
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: |
          sha256sum "labtether-cli-${SUFFIX}" > "labtether-cli-${SUFFIX}.sha256"

      - name: Attest binary provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: labtether-cli-${{ matrix.suffix }}

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            labtether-cli-${{ matrix.suffix }}
            labtether-cli-${{ matrix.suffix }}.sha256
            labtether-cli-*.tar.gz
            labtether-cli-*.tar.gz.sha256
            labtether-cli-*.zip
            labtether-cli-*.zip.sha256
