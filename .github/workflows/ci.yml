name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  line-limit:
    name: Handwritten code / 500-line limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check line-limit gate behavior
        run: python3 -m unittest scripts/ci/test_line_limit.py
      - name: Enforce full-repository line limit
        run: python3 scripts/ci/check-line-limit.py
      - name: Block personal details
        run: python3 scripts/ci/check-private-info.py

  qa-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks_required: ${{ steps.select.outputs.checks_required }}
      contracts: ${{ steps.select.outputs.contracts }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test QA contract selector
        run: ./scripts/ci/test-select-qa-contracts.sh
      - name: Select risk-based QA contracts
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mode="auto"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            mode="full"
          fi
          args=(--mode "${mode}" --head "${GITHUB_SHA}")
          # Manual and tag runs have no base commit; omit it rather than pass "".
          if [[ -n "${BASE_SHA:-}" ]]; then
            args+=(--base "${BASE_SHA}")
          fi
          ./scripts/ci/select-qa-contracts.sh "${args[@]}"

  build-and-test:
    needs: [line-limit, qa-contracts]
    if: >-
      !cancelled() && (needs.line-limit.result != 'success' ||
      needs.qa-contracts.result != 'success' || needs.qa-contracts.outputs.checks_required != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require source-size and selection gates
        shell: bash
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
          SELECTION_RESULT: ${{ needs.qa-contracts.result }}
        run: |
          test "${LINE_LIMIT_RESULT}" = success
          test "${SELECTION_RESULT}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Check formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not gofmt'd:"
            gofmt -l .
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  installed-cli-package:
    needs: qa-contracts
    if: needs.qa-contracts.outputs.checks_required != 'false' && contains(format(',{0},', needs.qa-contracts.outputs.contracts), ',installed-cli-package,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build, archive, install, and execute the native CLI
        run: ./scripts/ci/installed-package-smoke.sh

  cross-platform-build:
    needs: qa-contracts
    if: needs.qa-contracts.outputs.checks_required != 'false' && contains(format(',{0},', needs.qa-contracts.outputs.contracts), ',cross-platform-build,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Cross-build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o "${RUNNER_TEMP}/labtether-cli-${GOOS}-${GOARCH}" .

  tls-permission-behavior:
    needs: qa-contracts
    if: needs.qa-contracts.outputs.checks_required != 'false' && contains(format(',{0},', needs.qa-contracts.outputs.contracts), ',tls-permission-behavior,')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: true
      - name: Run focused credential, permission, and TLS tests with race detection
        run: go test -race ./cmd ./internal/client

  ci-result:
    name: CI result
    if: always()
    needs: [line-limit, qa-contracts, build-and-test, installed-cli-package, cross-platform-build, tls-permission-behavior]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          errors = []
          for job in ("line-limit", "qa-contracts"):
              if needs.get(job, {}).get("result") != "success":
                  errors.append(f"{job} must succeed")

          outputs = needs.get("qa-contracts", {}).get("outputs", {})
          checks = outputs.get("checks_required")
          mode = outputs.get("mode")
          contracts = outputs.get("contracts")
          contract_jobs = {"installed-cli-package", "cross-platform-build", "tls-permission-behavior"}
          if checks not in ("true", "false") or mode not in ("auto", "full"):
              errors.append("QA selector returned invalid checks_required or mode")
          selected = set(contracts.split(",")) if isinstance(contracts, str) and contracts else set()
          if not isinstance(contracts, str) or not selected <= contract_jobs:
              errors.append("QA selector returned missing or unknown contracts")
          if checks == "false" and selected:
              errors.append("QA selector cannot skip checks with selected contracts")
          if mode == "full" and (checks != "true" or selected != contract_jobs):
              errors.append("Full QA must select every contract")

          required = {"build-and-test": checks == "true"}
          required.update({job: job in selected for job in contract_jobs})
          for job, selected_job in required.items():
              result = needs.get(job, {}).get("result")
              allowed = ("success",) if selected_job else ("success", "skipped")
              if result not in allowed:
                  errors.append(f"{job}: {result!r}, expected {' or '.join(allowed)}")
          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("Every selected CI check passed.")
          PY
